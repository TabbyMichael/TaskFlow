version: "3.9"
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taskforge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./Backend
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app

  frontend:
    build: ./Frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    volumes:
      - ./Frontend:/app

volumes:
  pgdata:
