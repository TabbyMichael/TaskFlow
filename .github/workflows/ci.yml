name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements.txt
          pip install flake8 black
      
      - name: Lint with flake8
        run: |
          cd Backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check formatting with black
        run: |
          cd Backend
          black --check .

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      
      - name: Lint with ESLint
        run: |
          cd Frontend
          npm run lint
      
      - name: Check formatting with Prettier
        run: |
          cd Frontend
          npx prettier --check .

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: taskforge_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements.txt
          pip install pytest pytest-django
      
      - name: Run migrations
        run: |
          cd Backend
          python manage.py migrate --run-syncdb
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taskforge_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DEBUG: True
          SECRET_KEY: test-secret-key
          REDIS_URL: redis://localhost:6379/0
      
      - name: Run tests
        run: |
          cd Backend
          python manage.py test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taskforge_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DEBUG: True
          SECRET_KEY: test-secret-key
          REDIS_URL: redis://localhost:6379/0

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd Frontend
          npm ci
      
      - name: Build application
        run: |
          cd Frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:8000

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          tags: taskflow-backend:${{ github.sha }}
          cache-from: type=registry,ref=taskflow-backend:buildcache
          cache-to: type=registry,ref=taskflow-backend:buildcache,mode=max
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          tags: taskflow-frontend:${{ github.sha }}
          cache-from: type=registry,ref=taskflow-frontend:buildcache
          cache-to: type=registry,ref=taskflow-frontend:buildcache,mode=max

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, build-frontend]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.lint-backend.result }}" == "failure" ] || \
             [ "${{ needs.lint-frontend.result }}" == "failure" ] || \
             [ "${{ needs.test-backend.result }}" == "failure" ] || \
             [ "${{ needs.build-frontend.result }}" == "failure" ]; then
            echo "::warning::One or more CI jobs failed. Check the workflow run for details."
          else
            echo "::notice::All CI jobs passed successfully!"
          fi